<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>dataskate</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --navy:#13192b;
  --navy-2:#1c2538;
  --navy-3:#222d42;
  --red:#ed1c24;
  --border:rgba(255,255,255,.08);
  --muted:rgba(255,255,255,.38);
}

html,body{
  height:100%;
  font-family:'DM Sans',sans-serif;
  background:var(--navy);
  color:#fff;
  overflow:hidden;
}

/* dot-grid atmosphere */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:26px 26px;
  pointer-events:none;
  z-index:0;
}

/* subtle red glow behind clock */
body::after{
  content:'';
  position:fixed;
  top:30%;
  left:50%;
  transform:translate(-50%,-50%);
  width:600px;
  height:300px;
  background:radial-gradient(ellipse,rgba(237,28,36,.06) 0%,transparent 70%);
  pointer-events:none;
  z-index:0;
}

.page{
  position:relative;
  z-index:1;
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:28px 40px 36px;
}

/* ── topbar ── */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  text-decoration:none;
}

.logo-name{
  font-family:'Outfit',sans-serif;
  font-weight:900;
  font-size:17px;
  letter-spacing:-.3px;
  color:#fff;
}
.logo-name span{color:var(--red);}

.date-pill{
  font-size:11.5px;
  font-weight:500;
  color:var(--muted);
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  padding:5px 14px;
  border-radius:20px;
  letter-spacing:.2px;
  font-family:'DM Sans',sans-serif;
}

/* ── hero / clock ── */
.hero{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding-bottom:12px;
}

.clock-wrap{
  line-height:1;
  margin-bottom:14px;
}

.clock-time{
  font-family:'Outfit',sans-serif;
  font-weight:200;
  font-size:clamp(80px,13vw,148px);
  letter-spacing:-.05em;
  color:#fff;
  display:inline;
}

.clock-period{
  font-family:'Outfit',sans-serif;
  font-weight:400;
  font-size:clamp(20px,2.8vw,36px);
  color:var(--muted);
  letter-spacing:0;
  margin-left:6px;
  vertical-align:super;
  display:inline;
}

.greeting{
  font-family:'DM Sans',sans-serif;
  font-size:clamp(13px,1.5vw,16px);
  font-weight:500;
  color:var(--muted);
  letter-spacing:.1px;
}
.greeting strong{color:#fff;font-weight:600;}

/* ── destination cards ── */
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  max-width:860px;
  width:100%;
  margin:0 auto;
  flex-shrink:0;
}

.card{
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:18px 18px 16px;
  background:var(--navy-2);
  border:1px solid var(--border);
  border-radius:14px;
  text-decoration:none;
  color:#fff;
  position:relative;
  overflow:hidden;
  transition:background .18s,border-color .18s,transform .18s;
}

.card:hover{
  background:var(--navy-3);
  border-color:rgba(255,255,255,.14);
  transform:translateY(-2px);
}

/* action board — primary card */
.card.primary{
  border-color:rgba(237,28,36,.28);
  background:rgba(237,28,36,.05);
}
.card.primary:hover{
  border-color:rgba(237,28,36,.5);
  background:rgba(237,28,36,.09);
}

/* top accent line on primary */
.card.primary::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:var(--red);
  border-radius:2px 2px 0 0;
}

.card-ico{
  width:36px;height:36px;
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.card-ico [data-lucide]{width:16px;height:16px;}

.card-label{
  font-size:10px;
  font-weight:700;
  letter-spacing:.9px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:2px;
}

.card-name{
  font-family:'Outfit',sans-serif;
  font-weight:700;
  font-size:14.5px;
  letter-spacing:-.15px;
}

.card-url{
  font-size:10.5px;
  color:var(--muted);
  font-family:'DM Sans',sans-serif;
  font-weight:500;
  margin-top:auto;
  padding-top:10px;
  border-top:1px solid var(--border);
}

/* arrow badge top-right */
.card-arrow{
  position:absolute;
  top:14px;right:14px;
  opacity:0;
  transition:opacity .18s,transform .18s;
}
.card-arrow [data-lucide]{width:13px;height:13px;color:var(--muted);}
.card:hover .card-arrow{opacity:1;transform:translate(1px,-1px);}

/* ── responsive ── */
@media(max-width:720px){
  html,body{overflow:auto;}
  .page{height:auto;min-height:100vh;}
  .cards{grid-template-columns:repeat(2,1fr);}
  .hero{padding:48px 0 40px;}
}
@media(max-width:420px){
  .cards{grid-template-columns:1fr;}
  .page{padding:20px 20px 28px;}
}

/* reduced motion */
@media(prefers-reduced-motion:reduce){
  .card{transition:none;}
  .card-arrow{transition:none;}
}
</style>
</head>
<body>
<div class="page">

  <!-- topbar -->
  <div class="topbar">
    <div class="logo">
      <svg viewBox="156 275 78 66" xmlns="http://www.w3.org/2000/svg" style="width:26px;height:22px">
        <path fill="#ed1c24" d="m195.02,287.72v-12.49c21.94,0,38.48,10.29,38.48,23.93s-16.55,23.93-38.48,23.93v-12.49c15.86,0,25.99-6.77,25.99-11.44s-10.13-11.44-25.99-11.44Z"/>
        <path fill="#ffffff" d="m195.02,327.75v12.49c-21.94,0-38.48-10.29-38.48-23.93s16.55-23.93,38.48-23.93v12.49c-15.86,0-25.99,6.77-25.99,11.44s10.13,11.44,25.99,11.44Z"/>
      </svg>
      <div class="logo-name">data<span>skate</span></div>
    </div>
    <div class="date-pill" id="date-pill"></div>
  </div>

  <!-- clock hero -->
  <div class="hero">
    <div class="clock-wrap">
      <span class="clock-time" id="clock-time">—</span><span class="clock-period" id="clock-period"></span>
    </div>
    <div class="greeting" id="greeting">Good morning, <strong>Davis</strong></div>
  </div>

  <!-- destinations -->
  <div class="cards">

    <a href="https://dsc.dataskate.online/board" class="card primary">
      <div class="card-ico" style="background:rgba(237,28,36,.14)">
        <i data-lucide="clipboard-list" style="color:#ed1c24"></i>
      </div>
      <div>
        <div class="card-label">Primary</div>
        <div class="card-name">Action Board</div>
      </div>
      <div class="card-url">dsc.dataskate.online/board</div>
      <div class="card-arrow"><i data-lucide="arrow-up-right"></i></div>
    </a>

    <a href="https://dsc.dataskate.online/dashboard" class="card">
      <div class="card-ico" style="background:rgba(124,58,237,.15)">
        <i data-lucide="bar-chart-2" style="color:#9d7bea"></i>
      </div>
      <div>
        <div class="card-label">Analytics</div>
        <div class="card-name">DSC Dashboard</div>
      </div>
      <div class="card-url">dsc.dataskate.online/dashboard</div>
      <div class="card-arrow"><i data-lucide="arrow-up-right"></i></div>
    </a>

    <a href="https://dsc.dataskate.online" class="card">
      <div class="card-ico" style="background:rgba(30,100,180,.2)">
        <i data-lucide="layers" style="color:#5ba3db"></i>
      </div>
      <div>
        <div class="card-label">Platform</div>
        <div class="card-name">DSC Platform</div>
      </div>
      <div class="card-url">dsc.dataskate.online</div>
      <div class="card-arrow"><i data-lucide="arrow-up-right"></i></div>
    </a>

    <a href="https://wireframe.dataskate.online" class="card">
      <div class="card-ico" style="background:rgba(255,255,255,.06)">
        <i data-lucide="layout-template" style="color:rgba(255,255,255,.45)"></i>
      </div>
      <div>
        <div class="card-label">Design</div>
        <div class="card-name">AE Hub Wireframe</div>
      </div>
      <div class="card-url">wireframe.dataskate.online</div>
      <div class="card-arrow"><i data-lucide="arrow-up-right"></i></div>
    </a>

  </div>

</div>

<script>
lucide.createIcons();

function pad(n){return n<10?'0'+n:''+n;}

const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function tick(){
  const now=new Date();
  const h24=now.getHours();
  const m=now.getMinutes();
  const period=h24>=12?'PM':'AM';
  const h12=h24%12||12;

  document.getElementById('clock-time').textContent=h12+':'+pad(m);
  document.getElementById('clock-period').textContent=period;

  const g=h24<12?'Good morning':h24<17?'Good afternoon':'Good evening';
  document.getElementById('greeting').innerHTML=g+', <strong>Davis</strong>';

  document.getElementById('date-pill').textContent=
    DAYS[now.getDay()]+', '+now.getDate()+' '+MONTHS[now.getMonth()]+' '+now.getFullYear();
}

tick();
setInterval(tick,1000);
</script>
</body>
</html>
